<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif">
<title id="title">How a round reaches a Claude Code session</title>
<desc id="desc">Three steps. Point and talk: a pin drops on a button while you say this button is too small. A round: the Trip Planner round of Oct 21 holds two numbered points, each with a picture. Your session: Claude Code receives the round through watch_rounds and marks each point done.</desc>
<defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1e1e28" flood-opacity="0.21"/></filter>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#dde5ee"/><stop offset=".52" stop-color="#ece8e2"/><stop offset="1" stop-color="#f2e2d6"/>
  </linearGradient>
</defs>
<rect width="1280" height="320" rx="22" fill="url(#wall)"/>
<g filter="url(#sh)"><rect x="70" y="28" width="340" height="196" rx="18" fill="rgba(250,250,252,.88)"/></g><rect x="70.5" y="28.5" width="339" height="195" rx="17.5" fill="none" stroke="rgba(255,255,255,.9)"/>
  <rect x="92" y="50" width="296" height="110" rx="10" fill="#f6f7f9" stroke="#e6e8ec"/>
  <text x="110" y="82" font-size="15" font-weight="700" fill="#1b1f24">Lisbon</text>
  <rect x="110" y="92" width="96" height="6" rx="3" fill="#e6e8ec"/>
  <rect x="110" y="120" width="140" height="24" rx="7" fill="#e6e8ec" fill-opacity=".7"/>
  <rect x="284" y="116" width="52" height="20" rx="6" fill="#0f6b5c"/>
  <text x="310" y="130" text-anchor="middle" font-size="10.5" font-weight="650" fill="#f6f7f9">Book</text>
  <rect x="319" y="109" width="2" height="9" rx="1" fill="#ffaa2b"/><circle cx="320" cy="100" r="10" fill="#ffaa2b" stroke="#ffffff" stroke-width="2"/><text x="320" y="103.6" text-anchor="middle" font-size="11" font-weight="800" fill="#3a2200">1</text>
  <path d="M2 2v22l6-5.6 3.8 8.6 3.4-1.5-3.7-8.4H20z" transform="translate(328 128) scale(.9) translate(-2 -2)" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="104" cy="190" r="8" fill="#ffaa2b"/>
  <text x="104" y="194" text-anchor="middle" font-size="10" font-weight="800" fill="#3a2200">1</text>
  <text x="120" y="195" font-size="14" fill="#1d1d1f"><tspan font-weight="700" fill="#8f4b00">This</tspan> button is too small.</text>
<g filter="url(#sh)"><rect x="470" y="28" width="340" height="196" rx="18" fill="rgba(250,250,252,.88)"/></g><rect x="470.5" y="28.5" width="339" height="195" rx="17.5" fill="none" stroke="rgba(255,255,255,.9)"/>
  <text x="492" y="66" font-size="13" fill="#55555c"><tspan font-weight="700" fill="#1d1d1f">Trip Planner</tspan> · Oct 21</text>
  <text x="788" y="66" text-anchor="end" font-size="12.5" fill="#8e8e95">2 points</text>
  <rect x="470" y="78" width="340" height=".8" fill="rgba(0,0,0,.09)"/>
  <rect x="492" y="92" width="64" height="44" rx="8" fill="#a9d2ec"/>
  <rect x="492" y="114" width="64" height="22" rx="0" fill="#4d8fc2" fill-opacity=".55"/>
  <rect x="492" y="92" width="64" height="44" rx="8" fill="none" stroke="#e6e8ec"/>
  <circle cx="578" cy="114" r="10" fill="#ffaa2b"/>
  <text x="578" y="118" text-anchor="middle" font-size="11" font-weight="800" fill="#3a2200">1</text>
  <text x="598" y="119" font-size="14" fill="#1d1d1f">Button too small</text>
  <rect x="492" y="150" width="64" height="44" rx="8" fill="#f6dfba"/>
  <rect x="492" y="172" width="64" height="22" rx="0" fill="#e2a466" fill-opacity=".55"/>
  <rect x="492" y="150" width="64" height="44" rx="8" fill="none" stroke="#e6e8ec"/>
  <circle cx="578" cy="172" r="10" fill="#ffaa2b"/>
  <text x="578" y="176" text-anchor="middle" font-size="11" font-weight="800" fill="#3a2200">2</text>
  <text x="598" y="177" font-size="14" fill="#1d1d1f">Gap too big</text>
<g filter="url(#sh)"><rect x="870" y="28" width="340" height="196" rx="18" fill="rgba(250,250,252,.88)"/></g><rect x="870.5" y="28.5" width="339" height="195" rx="17.5" fill="none" stroke="rgba(255,255,255,.9)"/>
  <rect x="884" y="42" width="312" height="168" rx="10" fill="#1b1c1f"/>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#d9dade" xml:space="preserve">
    <text x="900" y="70" fill="#8a8d94">&gt; /deixis-watch</text>
    <text x="900" y="94"><tspan fill="#ffb24a">●</tspan> watch_rounds()</text>
    <text x="900" y="114" fill="#8a8d94" xml:space="preserve">  Trip Planner · 2 points</text>
    <text x="900" y="138"><tspan fill="#ffb24a">●</tspan> set_status(in_progress)</text>
    <path d="M900.6 157.8l2.4 2.6 4.6-6" fill="none" stroke="#6fd48b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="914.4" y="162">Point 1 done</text>
    <path d="M900.6 181.8l2.4 2.6 4.6-6" fill="none" stroke="#6fd48b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="914.4" y="186">Point 2 done</text>
  </g>
<line x1="418" y1="126" x2="456" y2="126" stroke="rgba(240,140,0,.85)" stroke-width="1.6" stroke-linecap="round"/><path d="M453 121l7 5-7 5" fill="none" stroke="rgba(240,140,0,.85)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="440.0" y="114" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#8e8e95">send</text>
<line x1="818" y1="126" x2="856" y2="126" stroke="rgba(240,140,0,.85)" stroke-width="1.6" stroke-linecap="round"/><path d="M853 121l7 5-7 5" fill="none" stroke="rgba(240,140,0,.85)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="840.0" y="114" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#8e8e95">deliver</text>
<text x="74" y="264" font-size="16" font-weight="700" fill="#1d1d1f">1  Point and talk</text><text x="74" y="288" font-size="14" fill="#55555c">Hold right ⌥, point at it and say what should change.</text>
<text x="474" y="264" font-size="16" font-weight="700" fill="#1d1d1f">2  A round</text><text x="474" y="288" font-size="14" fill="#55555c">Numbered points, each with a picture.</text>
<text x="874" y="264" font-size="16" font-weight="700" fill="#1d1d1f">3  Your session</text><text x="874" y="288" font-size="14" fill="#55555c">Claude Code works through it point by point.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="288" viewBox="0 0 560 288" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif">
<title id="title">Step 2: a round</title>
<desc id="desc">The Trip Planner round of Oct 21 holds two numbered points, each with a picture: button too small, gap too big.</desc>
<defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.36"/></filter>
  <filter id="shs" x="-60%" y="-60%" width="220%" height="240%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity=".3"/></filter>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#141a24"/><stop offset=".52" stop-color="#18171d"/><stop offset="1" stop-color="#221817"/>
  </linearGradient>
  <linearGradient id="img0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f5f86"/><stop offset="1" stop-color="#173a5a"/></linearGradient>
  <linearGradient id="img1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b5638"/><stop offset="1" stop-color="#3e3022"/></linearGradient>
</defs>
<rect width="560" height="288" rx="16" fill="url(#wall)"/>

<g filter="url(#sh)"><rect x="32" y="32" width="496" height="224" rx="16" fill="rgba(40,40,46,.9)"/></g><rect x="32.5" y="32.5" width="495" height="223" rx="15.5" fill="none" stroke="rgba(255,255,255,.1)"/>
<text x="56" y="72" font-size="20" fill="#a9a9b1"><tspan font-weight="700" fill="#f2f2f4">Trip Planner</tspan> · Oct 21</text>
<text x="504" y="72" text-anchor="end" font-size="20" fill="#7a7a83">2 points</text>
<rect x="32" y="95.5" width="496" height="1" fill="rgba(255,255,255,.12)"/>
<rect x="56" y="112" width="88" height="56" rx="8" fill="url(#img0)"/>
<rect x="56.5" y="112.5" width="87" height="55" rx="7.5" fill="none" stroke="#2c3036"/>
<circle cx="176" cy="140" r="15" fill="#ffaa2b"/><text x="176" y="147" text-anchor="middle" font-size="20" font-weight="800" fill="#3a2200">1</text>
<text x="208" y="148" font-size="22" fill="#f2f2f4">Button too small</text>
<rect x="56" y="184" width="88" height="56" rx="8" fill="url(#img1)"/>
<rect x="56.5" y="184.5" width="87" height="55" rx="7.5" fill="none" stroke="#2c3036"/>
<circle cx="176" cy="212" r="15" fill="#ffaa2b"/><text x="176" y="219" text-anchor="middle" font-size="20" font-weight="800" fill="#3a2200">2</text>
<text x="208" y="220" font-size="22" fill="#f2f2f4">Gap too big</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif">
<title id="title">Deixis plugin for Claude Code</title>
<desc id="desc">Show it, don't describe it. A pointer moves over a Trip Planner page, two numbered pins drop while a spoken line appears in a small glass card, and the round arrives in a Claude Code session where both points are marked done.</desc>
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#dde5ee"/><stop offset=".52" stop-color="#ece8e2"/><stop offset="1" stop-color="#f2e2d6"/>
  </linearGradient>
  <linearGradient id="img0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9d2ec"/><stop offset="1" stop-color="#4d8fc2"/></linearGradient><linearGradient id="img1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6dfba"/><stop offset="1" stop-color="#e2a466"/></linearGradient><linearGradient id="img2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7c1a0"/><stop offset="1" stop-color="#8d74b4"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="170%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1e1e28" flood-opacity=".30"/></filter>
  <filter id="shs" x="-60%" y="-60%" width="220%" height="240%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".3"/></filter>
  <filter id="glow" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="10"/></filter>
  <clipPath id="frame"><rect width="1280" height="400" rx="22"/></clipPath>
  <clipPath id="win"><rect x="600" y="48" width="440" height="304" rx="12"/></clipPath>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="6" fill="rgba(255,163,26,.16)"/></pattern>
  <style>@keyframes cur{0%,6%{transform:translate(884px,246px);animation-timing-function:cubic-bezier(.45,0,.2,1);}18%,30%{transform:translate(776px,167px);animation-timing-function:cubic-bezier(.45,0,.2,1);}40%,56%{transform:translate(762px,282px);animation-timing-function:cubic-bezier(.45,0,.2,1);}68%,100%{transform:translate(884px,246px);}}
@keyframes listen{0%,5%{opacity:0;}9%,54%{opacity:1;}60%,100%{opacity:0;}}
@keyframes card{0%,7%{opacity:0;transform:translateY(8px) scale(.97);animation-timing-function:cubic-bezier(.16,1,.3,1);}11%,56%{opacity:1;transform:none;}61%,100%{opacity:0;transform:translateY(-6px);}}
@keyframes c0{0%,21.6%{opacity:1;}22.6%,100%{opacity:0;}}
@keyframes c1{0%,21.6%{opacity:0;}22.6%,43.6%{opacity:1;}44.6%,100%{opacity:0;}}
@keyframes c2{0%,43.6%{opacity:0;}44.6%,100%{opacity:1;}}
@keyframes w0{0%,19%{fill-opacity:0;}20%,100%{fill-opacity:1;}}
@keyframes w1{0%,21%{fill-opacity:0;}22%,100%{fill-opacity:1;}}
@keyframes w2{0%,22.6%{fill-opacity:0;}23.6%,100%{fill-opacity:1;}}
@keyframes w3{0%,24%{fill-opacity:0;}25%,100%{fill-opacity:1;}}
@keyframes w4{0%,25.6%{fill-opacity:0;}26.6%,100%{fill-opacity:1;}}
@keyframes w5{0%,41%{fill-opacity:0;}42%,100%{fill-opacity:1;}}
@keyframes w6{0%,43%{fill-opacity:0;}44%,100%{fill-opacity:1;}}
@keyframes w7{0%,44.4%{fill-opacity:0;}45.4%,100%{fill-opacity:1;}}
@keyframes w8{0%,46%{fill-opacity:0;}47%,100%{fill-opacity:1;}}
@keyframes w9{0%,47.4%{fill-opacity:0;}48.4%,100%{fill-opacity:1;}}
@keyframes w10{0%,49%{fill-opacity:0;}50%,100%{fill-opacity:1;}}
@keyframes b1{0%,19%{opacity:0;}19.8%,100%{opacity:1;}}
@keyframes th1{0%,19%{stroke-dashoffset:1;opacity:1;}21.75%{stroke-dashoffset:0;opacity:1;}56%{stroke-dashoffset:0;opacity:1;}60%,100%{stroke-dashoffset:0;opacity:0;}}
@keyframes b2{0%,41%{opacity:0;}41.8%,100%{opacity:1;}}
@keyframes th2{0%,41%{stroke-dashoffset:1;opacity:1;}43.75%{stroke-dashoffset:0;opacity:1;}56%{stroke-dashoffset:0;opacity:1;}60%,100%{stroke-dashoffset:0;opacity:0;}}
@keyframes pin1{0%,22%{opacity:0;transform:translateY(-14px) scale(.4);animation-timing-function:cubic-bezier(.3,1.5,.5,1);}24.4%,91%{opacity:1;transform:none;}96%,100%{opacity:0;transform:scale(.6);}}
@keyframes rip1{0%,22.6%{opacity:0;transform:scale(.3);}23.2%{opacity:.9;transform:scale(.5);}27.5%,100%{opacity:0;transform:scale(1.6);}}
@keyframes hl1{0%,22.4%{opacity:0;}23.6%,90%{opacity:1;}93%,100%{opacity:0;}}
@keyframes pin2{0%,44%{opacity:0;transform:translateY(-14px) scale(.4);animation-timing-function:cubic-bezier(.3,1.5,.5,1);}46.4%,91%{opacity:1;transform:none;}96%,100%{opacity:0;transform:scale(.6);}}
@keyframes rip2{0%,44.6%{opacity:0;transform:scale(.3);}45.2%{opacity:.9;transform:scale(.5);}49.5%,100%{opacity:0;transform:scale(1.6);}}
@keyframes hl2{0%,44.4%{opacity:0;}45.6%,90%{opacity:1;}93%,100%{opacity:0;}}
@keyframes ok1{0%,72%{opacity:0;}73.5%,91%{opacity:1;}94%,100%{opacity:0;}}
@keyframes ok2{0%,82%{opacity:0;}83.5%,91%{opacity:1;}94%,100%{opacity:0;}}
@keyframes t1{0%,62%{opacity:0;}63.2%,94%{opacity:1;}97%,100%{opacity:0;}}
@keyframes t2{0%,72%{opacity:0;}73.2%,94%{opacity:1;}97%,100%{opacity:0;}}
@keyframes t3{0%,82%{opacity:0;}83.2%,94%{opacity:1;}97%,100%{opacity:0;}}
@keyframes gring{0%,61%{stroke-dashoffset:1;opacity:1;}86%,91%{stroke-dashoffset:0;opacity:1;}96%,100%{stroke-dashoffset:0;opacity:0;}}
@keyframes wave{0%{transform:scaleY(.35);}100%{transform:scaleY(1);}}
.a{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:linear;animation-fill-mode:both}
#cur{transform:translate(762px,282px);animation-name:cur}
.listen{opacity:0;animation-name:listen}
#card{animation-name:card;transform-box:fill-box;transform-origin:50% 0}
#c0,#c1{opacity:0} #c0{animation-name:c0} #c1{animation-name:c1} #c2{animation-name:c2}
#b1{animation-name:b1} #b2{animation-name:b2}
#th1{animation-name:th1} #th2{animation-name:th2}
#pin1{animation-name:pin1} #pin2{animation-name:pin2}
#rip1,#rip2{opacity:0;transform-box:fill-box;transform-origin:50% 50%} #rip1{animation-name:rip1} #rip2{animation-name:rip2}
#hl1{animation-name:hl1} #hl2{animation-name:hl2}
#ok2,#t3{opacity:0} #ok1{animation-name:ok1} #ok2{animation-name:ok2}
#t1{animation-name:t1} #t2{animation-name:t2} #t3{animation-name:t3}
#gring{stroke-dashoffset:.35;animation-name:gring}
.wv{transform-box:fill-box;transform-origin:50% 50%;animation:wave .9s ease-in-out infinite alternate}
.wv:nth-child(2){animation-delay:-.3s} .wv:nth-child(3){animation-delay:-.55s} .wv:nth-child(4){animation-delay:-.15s}
#w0{animation-name:w0}#w1{animation-name:w1}#w2{animation-name:w2}#w3{animation-name:w3}#w4{animation-name:w4}#w5{animation-name:w5}#w6{animation-name:w6}#w7{animation-name:w7}#w8{animation-name:w8}#w9{animation-name:w9}#w10{animation-name:w10}
@media (prefers-reduced-motion: reduce){.a,.wv{animation:none!important}}
</style>
</defs>
<g clip-path="url(#frame)">
  <rect width="1280" height="400" fill="url(#wall)"/>

  <!-- Brand -->
  <text x="66" y="112" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" letter-spacing="2.2" fill="#8f4b00">CLAUDE CODE PLUGIN</text>
  <g>
    <circle class="a listen" cx="80" cy="140" r="19" fill="none" stroke="#ffa31a" stroke-opacity=".45" stroke-width="2"/>
    <circle id="gring" class="a" cx="80" cy="140" r="19" fill="none" stroke="#2b9e4c" stroke-width="2.4" pathLength="1" stroke-dasharray="1" transform="rotate(-90 80 140)"/>
    <circle cx="80" cy="140" r="12" fill="#ffa31a"/>
    <path d="M2 2v22l6-5.6 3.8 8.6 3.4-1.5-3.7-8.4H20z" transform="translate(88 148) scale(.82) translate(-2 -2)" fill="#1d1d1f" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
  <text x="122" y="158" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif" font-size="50" font-weight="700" letter-spacing="-1" fill="#1d1d1f">Deixis</text>
  <text x="66" y="218" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="650" letter-spacing="-.3" fill="#1d1d1f">Show it, don’t describe it.</text>
  <g font-size="17" fill="#55555c">
    <text x="66" y="256">Point at something on screen and say what should</text>
    <text x="66" y="280">change. It arrives in your Claude Code session as a</text>
    <text x="66" y="304">round of numbered points, each with a picture.</text>
  </g>

  <!-- Trip Planner window -->
  <g filter="url(#sh)"><rect x="600" y="48" width="440" height="304" rx="12" fill="#f6f7f9"/></g>
  <g clip-path="url(#win)">
    <rect x="600" y="48" width="440" height="30" fill="#eef0f3"/>
    <rect x="600" y="77.5" width="440" height="1" fill="#e6e8ec"/>
    <circle cx="618" cy="63" r="5" fill="#ff5f57"/><circle cx="634" cy="63" r="5" fill="#febc2e"/><circle cx="650" cy="63" r="5" fill="#28c840"/>
    <rect x="740" y="54" width="180" height="18" rx="6" fill="#f6f7f9"/>
    <text x="830" y="67" text-anchor="middle" font-size="11" fill="#68707b"><tspan fill="#1b1f24" font-weight="600">localhost:5173</tspan>/trips</text>
    <circle cx="633" cy="101" r="8" fill="#0f6b5c"/>
    <path d="M629 103.5l4-7 4 7z" fill="#f6f7f9"/>
    <text x="648" y="106" font-size="14" font-weight="700" fill="#1b1f24">Trip Planner</text>
    <rect x="896" y="96" width="36" height="10" rx="5" fill="#e6e8ec"/>
    <rect x="942" y="96" width="36" height="10" rx="5" fill="#e6e8ec"/>
    <circle cx="1006" cy="101" r="10" fill="#d8ece8"/>
    <text x="624" y="150" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="-.4" fill="#1b1f24">Lisbon</text>
    <text x="624" y="170" font-size="12.5" fill="#68707b">4 nights · 2 guests</text>
    <rect x="744" y="155" width="54" height="20" rx="6" fill="#0f6b5c"/>
    <text x="771" y="169" text-anchor="middle" font-size="10.5" font-weight="650" fill="#f6f7f9">Book</text>
    
    <g>
      <rect x="624" y="212" width="120" height="118" rx="10" fill="#ffffff" stroke="#e6e8ec"/>
      <path d="M624 222a10 10 0 0 1 10-10h100a10 10 0 0 1 10 10v54h-120z" fill="url(#img0)"/>
      <text x="636" y="298" font-size="12" font-weight="650" fill="#1b1f24">Alfama</text>
      <rect x="636" y="308" width="64" height="6" rx="3" fill="#e6e8ec"/>
    </g>
    <g>
      <rect x="780" y="212" width="120" height="118" rx="10" fill="#ffffff" stroke="#e6e8ec"/>
      <path d="M780 222a10 10 0 0 1 10-10h100a10 10 0 0 1 10 10v54h-120z" fill="url(#img1)"/>
      <text x="792" y="298" font-size="12" font-weight="650" fill="#1b1f24">Belém</text>
      <rect x="792" y="308" width="56" height="6" rx="3" fill="#e6e8ec"/>
    </g>
    <g>
      <rect x="936" y="212" width="120" height="118" rx="10" fill="#ffffff" stroke="#e6e8ec"/>
      <path d="M936 222a10 10 0 0 1 10-10h100a10 10 0 0 1 10 10v54h-120z" fill="url(#img2)"/>
      <text x="948" y="298" font-size="12" font-weight="650" fill="#1b1f24">Sintra</text>
      <rect x="948" y="308" width="48" height="6" rx="3" fill="#e6e8ec"/>
    </g>
  </g>

  <!-- Highlights where the pins drop -->
  <g id="hl1" class="a">
    <rect x="740" y="151" width="62" height="28" rx="8" fill="rgba(255,163,26,.16)" stroke="rgba(240,140,0,.85)" stroke-width="1.6"/>
    <rect x="706" y="184" width="58" height="17" rx="4" fill="#ffa31a"/>
    <text x="735" y="196.5" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#3a2200">54 × 20</text>
  </g>
  <g id="hl2" class="a">
    <rect x="745" y="212" width="34" height="118" rx="3" fill="url(#hatch)" stroke="rgba(240,140,0,.85)" stroke-width="1.4" stroke-dasharray="4 3"/>
    <rect x="738" y="335" width="48" height="17" rx="4" fill="#ffa31a"/>
    <text x="762" y="347.5" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#3a2200">36 px</text>
  </g>

  <!-- Claude Code session -->
  <g filter="url(#sh)"><rect x="990" y="222" width="226" height="146" rx="10" fill="#1b1c1f"/></g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#d9dade">
    <rect x="990" y="246" width="226" height=".8" fill="#ffffff" fill-opacity=".08"/>
    <circle cx="1004" cy="234" r="3.6" fill="#ffffff" fill-opacity=".18"/><circle cx="1015" cy="234" r="3.6" fill="#ffffff" fill-opacity=".18"/><circle cx="1026" cy="234" r="3.6" fill="#ffffff" fill-opacity=".18"/>
    <text x="1040" y="238" font-size="10.5" fill="#8a8d94">claude · trip-planner</text>
    <text x="1002" y="266"><tspan fill="#ffb24a">✻</tspan> Claude Code</text>
    <text x="1002" y="283" fill="#8a8d94">&gt; /deixis-watch</text>
    <text x="1002" y="300"><tspan fill="#ffb24a">●</tspan> watch_rounds()</text>
    <text id="t1" class="a" x="1002" y="317" xml:space="preserve" fill="#8a8d94">  Trip Planner · 2 points</text>
    <text id="t2" class="a" x="1002" y="338"><tspan fill="#6fd48b">✓</tspan> Point 1 done</text>
    <text id="t3" class="a" x="1002" y="355"><tspan fill="#6fd48b">✓</tspan> Point 2 done</text>
  </g>

  <!-- Threads from the spoken word to the pointer -->
  <line id="th1" class="a" x1="858" y1="155" x2="776" y2="167" pathLength="1" stroke-dasharray="1" stroke="rgba(240,140,0,.85)" stroke-width="1.5" stroke-linecap="round"/>
  <line id="th2" class="a" x1="858" y1="181" x2="762" y2="282" pathLength="1" stroke-dasharray="1" stroke="rgba(240,140,0,.85)" stroke-width="1.5" stroke-linecap="round"/>

  
  <g transform="translate(776 167)">
    <circle id="rip1" class="a" cx="0" cy="-2" r="16" fill="none" stroke="#ffa31a" stroke-width="2"/>
    <g id="pin1" class="a">
      <rect x="-1.2" y="-11" width="2.4" height="11" rx="1" fill="#ffaa2b"/>
      <circle cx="0" cy="-22" r="12" fill="#ffaa2b" stroke="#ffffff" stroke-width="2.2" filter="url(#shs)"/>
      <text x="0" y="-17.6" text-anchor="middle" font-size="13" font-weight="800" fill="#3a2200">1</text>
      <g id="ok1" class="a">
        <circle cx="0" cy="-22" r="12" fill="#2b9e4c" stroke="#ffffff" stroke-width="2.2"/>
        <path d="M-5 -22l3.4 3.4 6.4-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
  
  <g transform="translate(762 282)">
    <circle id="rip2" class="a" cx="0" cy="-2" r="16" fill="none" stroke="#ffa31a" stroke-width="2"/>
    <g id="pin2" class="a">
      <rect x="-1.2" y="-11" width="2.4" height="11" rx="1" fill="#ffaa2b"/>
      <circle cx="0" cy="-22" r="12" fill="#ffaa2b" stroke="#ffffff" stroke-width="2.2" filter="url(#shs)"/>
      <text x="0" y="-17.6" text-anchor="middle" font-size="13" font-weight="800" fill="#3a2200">2</text>
      <g id="ok2" class="a">
        <circle cx="0" cy="-22" r="12" fill="#2b9e4c" stroke="#ffffff" stroke-width="2.2"/>
        <path d="M-5 -22l3.4 3.4 6.4-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- Begleiter HUD card -->
  <g id="card" class="a">
    <g filter="url(#sh)"><rect x="830" y="104" width="330" height="96" rx="16" fill="rgba(250,250,252,.88)"/></g>
    <rect x="830.5" y="104.5" width="329" height="95" rx="15.5" fill="none" stroke="rgba(255,255,255,.9)"/>
    <g fill="#ffa31a">
      <rect class="wv" x="848" y="117" width="2.4" height="10" rx="1.2"/>
      <rect class="wv" x="852.6" y="114" width="2.4" height="16" rx="1.2"/>
      <rect class="wv" x="857.2" y="116" width="2.4" height="12" rx="1.2"/>
      <rect class="wv" x="861.8" y="113" width="2.4" height="18" rx="1.2"/>
    </g>
    <text x="874" y="127" font-size="13" fill="#55555c"><tspan font-weight="700" fill="#1d1d1f">Trip Planner</tspan> · Oct 21</text>
    <g font-size="12.5" fill="#8e8e95" text-anchor="end">
      <text id="c0" class="a" x="1144" y="127">0 points</text>
      <text id="c1" class="a" x="1144" y="127">1 point</text>
      <text id="c2" class="a" x="1144" y="127">2 points</text>
    </g>
    <rect x="830" y="137" width="330" height=".8" fill="rgba(0,0,0,.09)"/>
    <g id="b1" class="a"><circle cx="858" cy="155" r="8.5" fill="#ffaa2b"/><text x="858" y="159" text-anchor="middle" font-size="10.5" font-weight="800" fill="#3a2200">1</text></g>
    <g id="b2" class="a"><circle cx="858" cy="181" r="8.5" fill="#ffaa2b"/><text x="858" y="185" text-anchor="middle" font-size="10.5" font-weight="800" fill="#3a2200">2</text></g>
    <text x="872" y="160" font-size="15" fill="#1d1d1f" xml:space="preserve"><tspan id="w0" class="a" fill="#8f4b00" font-weight="700">This</tspan><tspan id="w1" class="a"> button</tspan><tspan id="w2" class="a"> is</tspan><tspan id="w3" class="a"> too</tspan><tspan id="w4" class="a"> small.</tspan></text>
    <text x="872" y="186" font-size="15" fill="#1d1d1f" xml:space="preserve"><tspan id="w5" class="a" fill="#8f4b00" font-weight="700">Here</tspan><tspan id="w6" class="a"> the</tspan><tspan id="w7" class="a"> gap</tspan><tspan id="w8" class="a"> is</tspan><tspan id="w9" class="a"> too</tspan><tspan id="w10" class="a"> big.</tspan></text>
  </g>

  <!-- Option key held -->
  <g class="a listen">
    <rect x="600" y="364" width="78" height="24" rx="7" fill="rgba(250,250,252,.88)" stroke="rgba(255,255,255,.9)"/>
    <rect x="606" y="368" width="22" height="16" rx="4" fill="rgba(0,0,0,.06)"/>
    <text x="617" y="381" text-anchor="middle" font-size="12" font-weight="600" fill="#1d1d1f">⌥</text>
    <text x="636" y="381" font-size="12" fill="#55555c">held</text>
  </g>

  <!-- Pointer -->
  <g id="cur" class="a">
    <path d="M2 2v22l6-5.6 3.8 8.6 3.4-1.5-3.7-8.4H20z" transform="scale(1.05) translate(-2 -2)" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" filter="url(#shs)"/>
  </g>

  <!-- Screen edge light while listening -->
  <g class="a listen" fill="none">
    <rect x="0" y="0" width="1280" height="400" rx="22" stroke="rgb(255,150,40)" stroke-opacity=".45" stroke-width="22" filter="url(#glow)"/>
    <rect x="1" y="1" width="1278" height="398" rx="21" stroke="rgb(255,168,38)" stroke-opacity=".95" stroke-width="2"/>
  </g>
</g>
</svg>

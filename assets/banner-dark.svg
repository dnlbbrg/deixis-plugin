<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif">
<title id="title">Deixis plugin for Claude Code</title>
<desc id="desc">Show it, don't describe it. A pointer moves over a Trip Planner page, two numbered pins drop while a spoken line appears in a small glass card, and the round arrives in a Claude Code session where both points are marked done.</desc>
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#141a24"/><stop offset=".52" stop-color="#18171d"/><stop offset="1" stop-color="#221817"/>
  </linearGradient>
  <linearGradient id="img0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f5f86"/><stop offset="1" stop-color="#173a5a"/></linearGradient><linearGradient id="img1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b5638"/><stop offset="1" stop-color="#3e3022"/></linearGradient><linearGradient id="img2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a4a5e"/><stop offset="1" stop-color="#352a4a"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity=".6"/></filter>
  <filter id="shs" x="-60%" y="-60%" width="220%" height="240%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".3"/></filter>
  <filter id="glow" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="10"/></filter>
  <clipPath id="frame"><rect width="880" height="520" rx="16"/></clipPath>
  <clipPath id="win"><rect x="40" y="160" width="480" height="320" rx="12"/></clipPath>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="6" fill="rgba(255,170,50,.18)"/></pattern>
  <style>@keyframes cur{0%,6%{transform:translate(304px,312px);animation-timing-function:cubic-bezier(.45,0,.2,1);}18%,30%{transform:translate(464px,266px);animation-timing-function:cubic-bezier(.45,0,.2,1);}40%,56%{transform:translate(208px,432px);animation-timing-function:cubic-bezier(.45,0,.2,1);}68%,100%{transform:translate(304px,312px);}}
@keyframes listen{0%,5%{opacity:0;}9%,54%{opacity:1;}60%,100%{opacity:0;}}
@keyframes card{0%,7%{opacity:0;transform:translateY(8px) scale(.97);animation-timing-function:cubic-bezier(.16,1,.3,1);}11%,56%{opacity:1;transform:none;}61%,100%{opacity:0;transform:translateY(-6px);}}
@keyframes c0{0%,21.6%{opacity:1;}22.6%,100%{opacity:0;}}
@keyframes c1{0%,21.6%{opacity:0;}22.6%,43.6%{opacity:1;}44.6%,100%{opacity:0;}}
@keyframes c2{0%,43.6%{opacity:0;}44.6%,100%{opacity:1;}}
@keyframes w0{0%,19%{fill-opacity:0;}20%,100%{fill-opacity:1;}}
@keyframes w1{0%,21%{fill-opacity:0;}22%,100%{fill-opacity:1;}}
@keyframes w2{0%,22.6%{fill-opacity:0;}23.6%,100%{fill-opacity:1;}}
@keyframes w3{0%,24%{fill-opacity:0;}25%,100%{fill-opacity:1;}}
@keyframes w4{0%,25.6%{fill-opacity:0;}26.6%,100%{fill-opacity:1;}}
@keyframes w5{0%,41%{fill-opacity:0;}42%,100%{fill-opacity:1;}}
@keyframes w6{0%,43%{fill-opacity:0;}44%,100%{fill-opacity:1;}}
@keyframes w7{0%,44.4%{fill-opacity:0;}45.4%,100%{fill-opacity:1;}}
@keyframes w8{0%,46%{fill-opacity:0;}47%,100%{fill-opacity:1;}}
@keyframes w9{0%,47.4%{fill-opacity:0;}48.4%,100%{fill-opacity:1;}}
@keyframes w10{0%,49%{fill-opacity:0;}50%,100%{fill-opacity:1;}}
@keyframes b1{0%,19%{opacity:0;}19.8%,100%{opacity:1;}}
@keyframes th1{0%,19%{stroke-dashoffset:1;opacity:1;}21.75%{stroke-dashoffset:0;opacity:1;}56%{stroke-dashoffset:0;opacity:1;}60%,100%{stroke-dashoffset:0;opacity:0;}}
@keyframes b2{0%,41%{opacity:0;}41.8%,100%{opacity:1;}}
@keyframes th2{0%,41%{stroke-dashoffset:1;opacity:1;}43.75%{stroke-dashoffset:0;opacity:1;}56%{stroke-dashoffset:0;opacity:1;}60%,100%{stroke-dashoffset:0;opacity:0;}}
@keyframes pin1{0%,22%{opacity:0;transform:translateY(-14px) scale(.4);animation-timing-function:cubic-bezier(.3,1.5,.5,1);}24.4%,91%{opacity:1;transform:none;}96%,100%{opacity:0;transform:scale(.6);}}
@keyframes rip1{0%,22.6%{opacity:0;transform:scale(.3);}23.2%{opacity:.9;transform:scale(.5);}27.5%,100%{opacity:0;transform:scale(1.6);}}
@keyframes hl1{0%,22.4%{opacity:0;}23.6%,90%{opacity:1;}93%,100%{opacity:0;}}
@keyframes pin2{0%,44%{opacity:0;transform:translateY(-14px) scale(.4);animation-timing-function:cubic-bezier(.3,1.5,.5,1);}46.4%,91%{opacity:1;transform:none;}96%,100%{opacity:0;transform:scale(.6);}}
@keyframes rip2{0%,44.6%{opacity:0;transform:scale(.3);}45.2%{opacity:.9;transform:scale(.5);}49.5%,100%{opacity:0;transform:scale(1.6);}}
@keyframes hl2{0%,44.4%{opacity:0;}45.6%,90%{opacity:1;}93%,100%{opacity:0;}}
@keyframes ok1{0%,72%{opacity:0;}73.5%,91%{opacity:1;}94%,100%{opacity:0;}}
@keyframes ok2{0%,82%{opacity:0;}83.5%,91%{opacity:1;}94%,100%{opacity:0;}}
@keyframes t1{0%,62%{opacity:0;}63.2%,94%{opacity:1;}97%,100%{opacity:0;}}
@keyframes t2{0%,72%{opacity:0;}73.2%,94%{opacity:1;}97%,100%{opacity:0;}}
@keyframes t3{0%,82%{opacity:0;}83.2%,94%{opacity:1;}97%,100%{opacity:0;}}
@keyframes gring{0%,61%{stroke-dashoffset:1;opacity:1;}86%,91%{stroke-dashoffset:0;opacity:1;}96%,100%{stroke-dashoffset:0;opacity:0;}}
@keyframes wave{0%{transform:scaleY(.35);}100%{transform:scaleY(1);}}
.a{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:linear;animation-fill-mode:both}
#cur{transform:translate(208px,432px);animation-name:cur}
.listen{opacity:0;animation-name:listen}
#card{animation-name:card;transform-box:fill-box;transform-origin:50% 0}
#c0,#c1{opacity:0} #c0{animation-name:c0} #c1{animation-name:c1} #c2{animation-name:c2}
#b1{animation-name:b1} #b2{animation-name:b2}
#th1{animation-name:th1} #th2{animation-name:th2}
#pin1{animation-name:pin1} #pin2{animation-name:pin2}
#rip1,#rip2{opacity:0;transform-box:fill-box;transform-origin:50% 50%} #rip1{animation-name:rip1} #rip2{animation-name:rip2}
#hl1{animation-name:hl1} #hl2{animation-name:hl2}
#ok2,#t3{opacity:0} #ok1{animation-name:ok1} #ok2{animation-name:ok2}
#t1{animation-name:t1} #t2{animation-name:t2} #t3{animation-name:t3}
#gring{stroke-dashoffset:.35;animation-name:gring}
.wv{transform-box:fill-box;transform-origin:50% 50%;animation:wave .9s ease-in-out infinite alternate}
.wv:nth-child(2){animation-delay:-.3s} .wv:nth-child(3){animation-delay:-.55s} .wv:nth-child(4){animation-delay:-.15s}
#w0{animation-name:w0}#w1{animation-name:w1}#w2{animation-name:w2}#w3{animation-name:w3}#w4{animation-name:w4}#w5{animation-name:w5}#w6{animation-name:w6}#w7{animation-name:w7}#w8{animation-name:w8}#w9{animation-name:w9}#w10{animation-name:w10}
@media (prefers-reduced-motion: reduce){.a,.wv{animation:none!important}}
</style>
</defs>
<g clip-path="url(#frame)">
  <rect width="880" height="520" fill="url(#wall)"/>

  <!-- Brand: y 40..128 -->
  <text x="40" y="56" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600" letter-spacing="2.4" fill="#ffbe55">CLAUDE CODE PLUGIN</text>
  <g>
    <circle class="a listen" cx="64" cy="104" r="23" fill="none" stroke="#ffae33" stroke-opacity=".45" stroke-width="2"/>
    <circle id="gring" class="a" cx="64" cy="104" r="23" fill="none" stroke="#4cc36f" stroke-width="2.4" pathLength="1" stroke-dasharray="1" transform="rotate(-90 64 104)"/>
    <circle cx="64" cy="104" r="15" fill="#ffae33"/>
    <path d="M2 2v22l6-5.6 3.8 8.6 3.4-1.5-3.7-8.4H20z" transform="translate(73 113) scale(1) translate(-2 -2)" fill="#f2f2f4" stroke="#111216" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
  <text x="104" y="120" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-.9" fill="#f2f2f4">Deixis</text>
  <text x="840" y="120" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="650" letter-spacing="-.3" fill="#f2f2f4">Show it, don’t describe it.</text>

  <!-- Option key held: top right, x 760..840, y 40..72 -->
  <g class="a listen">
    <rect x="760.5" y="40.5" width="79" height="31" rx="8" fill="rgba(40,40,46,.9)" stroke="rgba(255,255,255,.1)"/>
    <rect x="768" y="46" width="24" height="20" rx="5" fill="rgba(255,255,255,.1)"/>
    <text x="780" y="61" text-anchor="middle" font-size="15" font-weight="600" fill="#f2f2f4">⌥</text>
    <text x="800" y="61" font-size="15" fill="#a9a9b1">held</text>
  </g>

  <!-- Trip Planner window: x 40..520, y 160..480 -->
  <g filter="url(#sh)"><rect x="40" y="160" width="480" height="320" rx="12" fill="#16181c"/></g>
  <g clip-path="url(#win)">
    <rect x="40" y="160" width="480" height="40" fill="#202328"/>
    <rect x="40" y="199.5" width="480" height="1" fill="#2c3036"/>
    <circle cx="64" cy="180" r="6" fill="#ff5f57"/><circle cx="84" cy="180" r="6" fill="#febc2e"/><circle cx="104" cy="180" r="6" fill="#28c840"/>
    <rect x="176" y="168" width="208" height="24" rx="7" fill="#16181c"/>
    <text x="280" y="185" text-anchor="middle" font-size="14" fill="#959ca6"><tspan fill="#e9ecef" font-weight="600">localhost:5173</tspan>/trips</text>
    <circle cx="72" cy="220" r="8" fill="#3fbfa6"/>
    <path d="M68.5 222.5l3.5-6 3.5 6z" fill="#16181c"/>
    <text x="88" y="225.5" font-size="15" font-weight="700" fill="#e9ecef">Trip Planner</text>
    <rect x="384" y="216" width="40" height="8" rx="4" fill="#2c3036"/>
    <rect x="432" y="216" width="32" height="8" rx="4" fill="#2c3036"/>
    <circle cx="488" cy="220" r="8" fill="#1d3833"/>
    <rect x="40" y="239.5" width="480" height="1" fill="#2c3036"/>
    <text x="64" y="282" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-.5" fill="#e9ecef">Lisbon</text>
    <text x="64" y="308" font-size="15" fill="#959ca6">4 nights · 2 guests</text>
    <rect x="432" y="264" width="64" height="32" rx="8" fill="#3fbfa6"/>
    <text x="464" y="285" text-anchor="middle" font-size="15" font-weight="650" fill="#16181c">Book</text>
    
    <g>
      <rect x="64" y="336" width="112" height="120" rx="10" fill="#1e2126" stroke="#2c3036"/>
      <path d="M64 346a10 10 0 0 1 10-10h92a10 10 0 0 1 10 10v54h-112z" fill="url(#img0)"/>
      <text x="76" y="424" font-size="15" font-weight="650" fill="#e9ecef">Alfama</text>
      <rect x="76" y="436" width="64" height="6" rx="3" fill="#2c3036"/>
    </g>
    <g>
      <rect x="240" y="336" width="112" height="120" rx="10" fill="#1e2126" stroke="#2c3036"/>
      <path d="M240 346a10 10 0 0 1 10-10h92a10 10 0 0 1 10 10v54h-112z" fill="url(#img1)"/>
      <text x="252" y="424" font-size="15" font-weight="650" fill="#e9ecef">Belém</text>
      <rect x="252" y="436" width="56" height="6" rx="3" fill="#2c3036"/>
    </g>
    <g>
      <rect x="384" y="336" width="112" height="120" rx="10" fill="#1e2126" stroke="#2c3036"/>
      <path d="M384 346a10 10 0 0 1 10-10h92a10 10 0 0 1 10 10v54h-112z" fill="url(#img2)"/>
      <text x="396" y="424" font-size="15" font-weight="650" fill="#e9ecef">Sintra</text>
      <rect x="396" y="436" width="48" height="6" rx="3" fill="#2c3036"/>
    </g>
  </g>

  <!-- Highlights where the pins drop -->
  <g id="hl1" class="a">
    <rect x="428" y="260" width="72" height="40" rx="10" fill="rgba(255,170,50,.18)" stroke="rgba(255,180,70,.85)" stroke-width="1.6"/>
    <rect x="344" y="268" width="72" height="24" rx="6" fill="#ffae33"/>
    <text x="380" y="285" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#3a2200">64 × 32</text>
  </g>
  <g id="hl2" class="a">
    <rect x="180" y="336" width="56" height="120" rx="4" fill="url(#hatch)" stroke="rgba(255,180,70,.85)" stroke-width="1.4" stroke-dasharray="4 3"/>
    <rect x="180" y="344" width="56" height="24" rx="6" fill="#ffae33"/>
    <text x="208" y="361" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#3a2200">64 px</text>
  </g>

  <!-- Begleiter HUD card: x 544..840, y 160..296 -->
  <g id="card" class="a">
    <g filter="url(#sh)"><rect x="544" y="160" width="296" height="136" rx="16" fill="rgba(40,40,46,.9)"/></g>
    <rect x="544.5" y="160.5" width="295" height="135" rx="15.5" fill="none" stroke="rgba(255,255,255,.1)"/>
    <g fill="#ffae33">
      <rect class="wv" x="562" y="178" width="3" height="12" rx="1.5"/>
      <rect class="wv" x="567.5" y="174" width="3" height="20" rx="1.5"/>
      <rect class="wv" x="573" y="177" width="3" height="14" rx="1.5"/>
      <rect class="wv" x="578.5" y="173" width="3" height="22" rx="1.5"/>
    </g>
    <text x="592" y="189" font-size="14" fill="#a9a9b1"><tspan font-weight="700" fill="#f2f2f4">Trip Planner</tspan> · Oct 21</text>
    <g font-size="14" fill="#7a7a83" text-anchor="end">
      <text id="c0" class="a" x="824" y="189">0 points</text>
      <text id="c1" class="a" x="824" y="189">1 point</text>
      <text id="c2" class="a" x="824" y="189">2 points</text>
    </g>
    <rect x="544" y="207.6" width="296" height=".8" fill="rgba(255,255,255,.12)"/>
    <g id="b1" class="a"><circle cx="572" cy="236" r="11" fill="#ffaa2b"/><text x="572" y="241" text-anchor="middle" font-size="14" font-weight="800" fill="#3a2200">1</text></g>
    <g id="b2" class="a"><circle cx="572" cy="268" r="11" fill="#ffaa2b"/><text x="572" y="273" text-anchor="middle" font-size="14" font-weight="800" fill="#3a2200">2</text></g>
    <text x="592" y="242" font-size="16" fill="#f2f2f4" xml:space="preserve"><tspan id="w0" class="a" fill="#ffbe55" font-weight="700">This</tspan><tspan id="w1" class="a"> button</tspan><tspan id="w2" class="a"> is</tspan><tspan id="w3" class="a"> too</tspan><tspan id="w4" class="a"> small.</tspan></text>
    <text x="592" y="274" font-size="16" fill="#f2f2f4" xml:space="preserve"><tspan id="w5" class="a" fill="#ffbe55" font-weight="700">Here</tspan><tspan id="w6" class="a"> the</tspan><tspan id="w7" class="a"> gap</tspan><tspan id="w8" class="a"> is</tspan><tspan id="w9" class="a"> too</tspan><tspan id="w10" class="a"> big.</tspan></text>
  </g>

  <!-- Claude Code session: x 544..840, y 320..480 -->
  <g filter="url(#sh)"><rect x="544" y="320" width="296" height="160" rx="12" fill="#0b0c0e"/></g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#d9dade">
    <rect x="544" y="351.6" width="296" height=".8" fill="#ffffff" fill-opacity=".1"/>
    <circle cx="564" cy="336" r="4.5" fill="#ffffff" fill-opacity=".18"/><circle cx="578" cy="336" r="4.5" fill="#ffffff" fill-opacity=".18"/><circle cx="592" cy="336" r="4.5" fill="#ffffff" fill-opacity=".18"/>
    <path d="M616.261 330.896v10.4696M611.73 333.51l9.07 5.23M611.73 338.75l9.07 -5.23" stroke="#ffb24a" stroke-width="2.06957" stroke-linecap="round"/><text x="629" y="341">Claude Code</text>
    <text x="560" y="380" fill="#8a8d94">&gt; /deixis-watch</text>
    <text x="560" y="400"><tspan fill="#ffb24a">●</tspan> watch_rounds()</text>
    <text id="t1" class="a" x="560" y="420" xml:space="preserve" fill="#8a8d94">  Trip Planner · 2 points</text>
    <g id="t2" class="a"><path d="M560.73 434.887l2.92174 3.16522 5.6 -7.30435" fill="none" stroke="#6fd48b" stroke-width="2.06957" stroke-linecap="round" stroke-linejoin="round"/><text x="577" y="440">Point 1 done</text></g>
    <g id="t3" class="a"><path d="M560.73 454.887l2.92174 3.16522 5.6 -7.30435" fill="none" stroke="#6fd48b" stroke-width="2.06957" stroke-linecap="round" stroke-linejoin="round"/><text x="577" y="460">Point 2 done</text></g>
  </g>

  <!-- Threads from the spoken word to the pointer -->
  <line id="th1" class="a" x1="561" y1="236" x2="464" y2="238" pathLength="1" stroke-dasharray="1" stroke="rgba(255,180,70,.85)" stroke-width="1.6" stroke-linecap="round"/>
  <line id="th2" class="a" x1="561" y1="268" x2="208" y2="404" pathLength="1" stroke-dasharray="1" stroke="rgba(255,180,70,.85)" stroke-width="1.6" stroke-linecap="round"/>

  
  <g transform="translate(464 266)">
    <circle id="rip1" class="a" cx="0" cy="-4" r="20" fill="none" stroke="#ffae33" stroke-width="2"/>
    <g id="pin1" class="a">
      <rect x="-1.5" y="-14" width="3" height="14" rx="1.2" fill="#ffaa2b"/>
      <circle cx="0" cy="-28" r="14" fill="#ffaa2b" stroke="#2a2a30" stroke-width="2.4" filter="url(#shs)"/>
      <text x="0" y="-22.6" text-anchor="middle" font-size="15" font-weight="800" fill="#3a2200">1</text>
      <g id="ok1" class="a">
        <circle cx="0" cy="-28" r="14" fill="#4cc36f" stroke="#2a2a30" stroke-width="2.4"/>
        <path d="M-6 -28l4 4 7.6-8.4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
  
  <g transform="translate(208 432)">
    <circle id="rip2" class="a" cx="0" cy="-4" r="20" fill="none" stroke="#ffae33" stroke-width="2"/>
    <g id="pin2" class="a">
      <rect x="-1.5" y="-14" width="3" height="14" rx="1.2" fill="#ffaa2b"/>
      <circle cx="0" cy="-28" r="14" fill="#ffaa2b" stroke="#2a2a30" stroke-width="2.4" filter="url(#shs)"/>
      <text x="0" y="-22.6" text-anchor="middle" font-size="15" font-weight="800" fill="#3a2200">2</text>
      <g id="ok2" class="a">
        <circle cx="0" cy="-28" r="14" fill="#4cc36f" stroke="#2a2a30" stroke-width="2.4"/>
        <path d="M-6 -28l4 4 7.6-8.4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- Pointer -->

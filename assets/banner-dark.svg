    <rect x="0" y="0" width="880" height="520" rx="16" stroke="rgb(255,150,40)" stroke-opacity=".45" stroke-width="22" filter="url(#glow)"/>
    <rect x="1" y="1" width="878" height="518" rx="15" stroke="rgb(255,168,38)" stroke-opacity=".95" stroke-width="2"/>

<svg xmlns="http://www.w3.org/2000/svg" width="880" height="712" viewBox="0 0 880 712" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif">
<title id="title">Deixis plugin for Claude Code</title>
<desc id="desc">Show it, don't describe it. A pointer moves over a Trip Planner page, two numbered pins drop while the spoken line appears in a glass card, and the round arrives in a Claude Code session where both points are marked done.</desc>
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#141a24"/><stop offset=".52" stop-color="#18171d"/><stop offset="1" stop-color="#221817"/>
  </linearGradient>
  <linearGradient id="img0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f5f86"/><stop offset="1" stop-color="#173a5a"/></linearGradient><linearGradient id="img1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b5638"/><stop offset="1" stop-color="#3e3022"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity=".6"/></filter>
  <filter id="shs" x="-60%" y="-60%" width="220%" height="240%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".3"/></filter>
  <filter id="glow" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="10"/></filter>
  <clipPath id="frame"><rect width="880" height="712" rx="16"/></clipPath>
  <clipPath id="win"><rect x="40" y="128" width="800" height="296" rx="12"/></clipPath>
  <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="8" fill="rgba(255,170,50,.18)"/></pattern>
  <linearGradient id="iconbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22335a"/><stop offset="1" stop-color="#0a1120"/></linearGradient>
  <linearGradient id="iconpin" x1="0.25" y1="0" x2="0.55" y2="1"><stop offset="0" stop-color="#ffb850"/><stop offset="0.55" stop-color="#f49e34"/><stop offset="1" stop-color="#e5831c"/></linearGradient>
  <style>@keyframes cur{0%,6%{transform:translate(560px,256px);animation-timing-function:cubic-bezier(.45,0,.2,1);}18%,30%{transform:translate(748px,236px);animation-timing-function:cubic-bezier(.45,0,.2,1);}40%,56%{transform:translate(436px,324px);animation-timing-function:cubic-bezier(.45,0,.2,1);}68%,100%{transform:translate(560px,256px);}}
@keyframes listen{0%,5%{opacity:0;}9%,54%{opacity:1;}60%,100%{opacity:0;}}
@keyframes c0{0%,21.6%{opacity:1;}22.6%,97%{opacity:0;}99.5%,100%{opacity:1;}}
@keyframes c1{0%,21.6%{opacity:0;}22.6%,43.6%{opacity:1;}44.6%,100%{opacity:0;}}
@keyframes c2{0%,43.6%{opacity:0;}44.6%,94%{opacity:1;}97%,100%{opacity:0;}}
@keyframes w0{0%,19%{fill-opacity:0;}20%,94%{fill-opacity:1;}97%,100%{fill-opacity:0;}}
@keyframes w1{0%,21%{fill-opacity:0;}22%,94%{fill-opacity:1;}97%,100%{fill-opacity:0;}}
@keyframes w2{0%,22.6%{fill-opacity:0;}23.6%,94%{fill-opacity:1;}97%,100%{fill-opacity:0;}}
@keyframes w3{0%,24%{fill-opacity:0;}25%,94%{fill-opacity:1;}97%,100%{fill-opacity:0;}}
@keyframes w4{0%,25.6%{fill-opacity:0;}26.6%,94%{fill-opacity:1;}97%,100%{fill-opacity:0;}}
@keyframes w5{0%,41%{fill-opacity:0;}42%,94%{fill-opacity:1;}97%,100%{fill-opacity:0;}}
@keyframes w6{0%,43%{fill-opacity:0;}44%,94%{fill-opacity:1;}97%,100%{fill-opacity:0;}}
@keyframes w7{0%,44.4%{fill-opacity:0;}45.4%,94%{fill-opacity:1;}97%,100%{fill-opacity:0;}}
@keyframes w8{0%,46%{fill-opacity:0;}47%,94%{fill-opacity:1;}97%,100%{fill-opacity:0;}}
@keyframes w9{0%,47.4%{fill-opacity:0;}48.4%,94%{fill-opacity:1;}97%,100%{fill-opacity:0;}}
@keyframes w10{0%,49%{fill-opacity:0;}50%,94%{fill-opacity:1;}97%,100%{fill-opacity:0;}}
@keyframes b1{0%,19%{opacity:0;}19.8%,94%{opacity:1;}97%,100%{opacity:0;}}
@keyframes ph1{0%,18.4%{opacity:1;}19%,97%{opacity:0;}99.5%,100%{opacity:1;}}
@keyframes b2{0%,41%{opacity:0;}41.8%,94%{opacity:1;}97%,100%{opacity:0;}}
@keyframes ph2{0%,40.4%{opacity:1;}41%,97%{opacity:0;}99.5%,100%{opacity:1;}}
@keyframes pin1{0%,22%{opacity:0;transform:translateY(-14px) scale(.4);animation-timing-function:cubic-bezier(.3,1.5,.5,1);}24.4%,94%{opacity:1;transform:none;animation-timing-function:cubic-bezier(.5,0,.75,0);}96.9%{opacity:1;transform:scale(0);}97%,100%{opacity:0;transform:translateY(-14px) scale(.4);}}
@keyframes rip1{0%,22.6%{opacity:0;transform:scale(.3);}23.2%{opacity:.9;transform:scale(.5);}27.5%,100%{opacity:0;transform:scale(1.6);}}
@keyframes hl1{0%,22.4%{opacity:0;}23.6%,94%{opacity:1;}97%,100%{opacity:0;}}
@keyframes pin2{0%,44%{opacity:0;transform:translateY(-14px) scale(.4);animation-timing-function:cubic-bezier(.3,1.5,.5,1);}46.4%,94%{opacity:1;transform:none;animation-timing-function:cubic-bezier(.5,0,.75,0);}96.9%{opacity:1;transform:scale(0);}97%,100%{opacity:0;transform:translateY(-14px) scale(.4);}}
@keyframes rip2{0%,44.6%{opacity:0;transform:scale(.3);}45.2%{opacity:.9;transform:scale(.5);}49.5%,100%{opacity:0;transform:scale(1.6);}}
@keyframes hl2{0%,44.4%{opacity:0;}45.6%,94%{opacity:1;}97%,100%{opacity:0;}}
@keyframes ok1{0%,72%{opacity:0;}73.5%,96.9%{opacity:1;}97%,100%{opacity:0;}}
@keyframes ok2{0%,82%{opacity:0;}83.5%,96.9%{opacity:1;}97%,100%{opacity:0;}}
@keyframes wait{0%,70%{opacity:1;}71.2%,97%{opacity:0;}99.5%,100%{opacity:1;}}
@keyframes t2{0%,72%{opacity:0;}73.2%,94%{opacity:1;}97%,100%{opacity:0;}}
@keyframes t3{0%,82%{opacity:0;}83.2%,94%{opacity:1;}97%,100%{opacity:0;}}
@keyframes wave{0%{transform:scaleY(.35);}100%{transform:scaleY(1);}}
.a{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:linear;animation-fill-mode:both}
#cur{transform:translate(436px,324px);animation-name:cur}
.listen{opacity:0;animation-name:listen}
#c0,#c1,#ph1,#ph2,#wait{opacity:0} #c0{animation-name:c0} #c1{animation-name:c1} #c2{animation-name:c2}
#ph1{animation-name:ph1} #ph2{animation-name:ph2} #b1{animation-name:b1} #b2{animation-name:b2}
#pin1{animation-name:pin1} #pin2{animation-name:pin2}
#rip1,#rip2{opacity:0;transform-box:fill-box;transform-origin:50% 50%} #rip1{animation-name:rip1} #rip2{animation-name:rip2}
#hl1{animation-name:hl1} #hl2{animation-name:hl2}
#ok2,#t3{opacity:0} #ok1{animation-name:ok1} #ok2{animation-name:ok2}
#wait{animation-name:wait} #t2{animation-name:t2} #t3{animation-name:t3}
.wv{transform-box:fill-box;transform-origin:50% 50%;animation:wave .9s ease-in-out infinite alternate}
.wv:nth-child(2){animation-delay:-.3s} .wv:nth-child(3){animation-delay:-.55s} .wv:nth-child(4){animation-delay:-.15s}
#w0{animation-name:w0}#w1{animation-name:w1}#w2{animation-name:w2}#w3{animation-name:w3}#w4{animation-name:w4}#w5{animation-name:w5}#w6{animation-name:w6}#w7{animation-name:w7}#w8{animation-name:w8}#w9{animation-name:w9}#w10{animation-name:w10}
@media (prefers-reduced-motion: reduce){.a,.wv{animation:none!important}}
</style>
</defs>
<g clip-path="url(#frame)">
  <rect width="880" height="712" fill="url(#wall)"/>

  <!-- Brand and tagline: y 40..104 -->
  <g>
    <!-- The Deixis app icon at 56 px: ink-blue squircle, the pointed orange pin. -->
    <g transform="translate(36 44) scale(0.0546875)">
      <rect width="1024" height="1024" rx="230" fill="url(#iconbg)"/>
      <path d="M165.8 854.2 C232.1 661.3 231.7 565.7 267.2 410.3 A286 286 0 1 1 609.7 752.8 C454.3 788.3 358.7 787.9 165.8 854.2 Z" fill="url(#iconpin)"/>
      <rect x="9" y="9" width="1006" height="1006" rx="222" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="18"/>
    </g>
  </g>
  <text x="104" y="90" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-1" fill="#f2f2f4">Deixis</text>
  <text x="840" y="88" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="650" letter-spacing="-.4" fill="#f2f2f4">Show it, don’t describe it.</text>

  <!-- Trip Planner window: x 40..840, y 128..424 -->
  <g filter="url(#sh)"><rect x="40" y="128" width="800" height="296" rx="12" fill="#16181c"/></g>
  <g clip-path="url(#win)">
    <rect x="40" y="128" width="800" height="48" fill="#202328"/>
    <rect x="40" y="175.5" width="800" height="1" fill="#2c3036"/>
    <circle cx="64" cy="152" r="7" fill="#ff5f57"/><circle cx="88" cy="152" r="7" fill="#febc2e"/><circle cx="112" cy="152" r="7" fill="#28c840"/>
    <rect x="272" y="136" width="336" height="32" rx="8" fill="#16181c"/>
    <text x="440" y="160" text-anchor="middle" font-size="24" fill="#959ca6"><tspan fill="#e9ecef" font-weight="600">localhost:5173</tspan>/trips</text>
    <text x="64" y="240" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-.6" fill="#e9ecef">Lisbon</text>
    <text x="64" y="280" font-size="24" fill="#959ca6">4 nights · 2 guests</text>
    <rect x="680" y="232" width="136" height="56" rx="12" fill="#3fbfa6"/>
    <text x="748" y="268" text-anchor="middle" font-size="24" font-weight="650" fill="#16181c">Book</text>
    
    <g>
      <rect x="64" y="312" width="312" height="88" rx="12" fill="#1e2126" stroke="#2c3036"/>
      <rect x="72" y="320" width="96" height="72" rx="8" fill="url(#img0)"/>
      <text x="192" y="352" font-size="24" font-weight="650" fill="#e9ecef">Alfama</text>
      <rect x="192" y="368" width="112" height="8" rx="4" fill="#2c3036"/>
    </g>
    <g>
      <rect x="504" y="312" width="312" height="88" rx="12" fill="#1e2126" stroke="#2c3036"/>
      <rect x="512" y="320" width="96" height="72" rx="8" fill="url(#img1)"/>
      <text x="632" y="352" font-size="24" font-weight="650" fill="#e9ecef">Belém</text>
      <rect x="632" y="368" width="88" height="8" rx="4" fill="#2c3036"/>
    </g>
  </g>

  <!-- Highlights where the pins drop; the size tag sits inside the gap, clear of both cards -->
  <g id="hl1" class="a">
    <rect x="672" y="224" width="152" height="72" rx="18" fill="rgba(255,170,50,.18)" stroke="rgba(255,180,70,.85)" stroke-width="2"/>
  </g>
  <g id="hl2" class="a">
    <rect x="376" y="312" width="128" height="88" rx="8" fill="url(#hatch)" stroke="rgba(255,180,70,.85)" stroke-width="1.6" stroke-dasharray="5 4"/>
    <rect x="384" y="360" width="112" height="32" rx="8" fill="#ffae33"/>
    <text x="440" y="384" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#3a2200">128 px</text>
  </g>

  <!-- Spoken card: x 40..480, y 448..672, always on screen -->
  <g filter="url(#sh)"><rect x="40" y="448" width="440" height="224" rx="16" fill="rgba(40,40,46,.9)"/></g>
  <rect x="40.5" y="448.5" width="439" height="223" rx="15.5" fill="none" stroke="rgba(255,255,255,.1)"/>
  <g fill="#ffae33">
    <rect class="wv" x="64" y="467" width="5" height="18" rx="2.5"/>
    <rect class="wv" x="72" y="461" width="5" height="30" rx="2.5"/>
    <rect class="wv" x="80" y="466" width="5" height="20" rx="2.5"/>
    <rect class="wv" x="88" y="460" width="5" height="32" rx="2.5"/>
  </g>
  <text x="112" y="484" font-size="24" font-weight="700" fill="#f2f2f4">Trip Planner</text>
  <g font-size="24" fill="#a9a9b1" text-anchor="end">
    <text id="c0" class="a" x="456" y="484">0 points</text>
    <text id="c1" class="a" x="456" y="484">1 point</text>
    <text id="c2" class="a" x="456" y="484">2 points</text>
  </g>
  <rect x="40" y="503.5" width="440" height="1" fill="rgba(255,255,255,.12)"/>
  
    <g id="ph1" class="a">
      <circle cx="80" cy="560" r="17" fill="none" stroke="#7a7a83" stroke-opacity=".6" stroke-width="2"/>
      <text x="80" y="568.4" text-anchor="middle" font-size="24" font-weight="700" fill="#7a7a83">1</text>
      <rect x="112" y="554" width="264" height="12" rx="6" fill="#7a7a83" fill-opacity=".28"/>
    </g>
    <g id="b1" class="a"><circle cx="80" cy="560" r="18" fill="#ffaa2b"/><text x="80" y="568.4" text-anchor="middle" font-size="24" font-weight="800" fill="#3a2200">1</text></g>
    <text x="112" y="568" font-size="24" fill="#f2f2f4" xml:space="preserve"><tspan id="w0" class="a" fill="#ffbe55" font-weight="700">This</tspan><tspan id="w1" class="a"> button</tspan><tspan id="w2" class="a"> is</tspan><tspan id="w3" class="a"> too</tspan><tspan id="w4" class="a"> small.</tspan></text>
    <g id="ph2" class="a">
      <circle cx="80" cy="616" r="17" fill="none" stroke="#7a7a83" stroke-opacity=".6" stroke-width="2"/>
      <text x="80" y="624.4" text-anchor="middle" font-size="24" font-weight="700" fill="#7a7a83">2</text>
      <rect x="112" y="610" width="240" height="12" rx="6" fill="#7a7a83" fill-opacity=".28"/>
    </g>
    <g id="b2" class="a"><circle cx="80" cy="616" r="18" fill="#ffaa2b"/><text x="80" y="624.4" text-anchor="middle" font-size="24" font-weight="800" fill="#3a2200">2</text></g>
    <text x="112" y="624" font-size="24" fill="#f2f2f4" xml:space="preserve"><tspan id="w5" class="a" fill="#ffbe55" font-weight="700">Here</tspan><tspan id="w6" class="a"> the</tspan><tspan id="w7" class="a"> gap</tspan><tspan id="w8" class="a"> is</tspan><tspan id="w9" class="a"> too</tspan><tspan id="w10" class="a"> big.</tspan></text>

  <!-- Claude Code session: x 504..840, y 448..672 -->
  <g filter="url(#sh)"><rect x="504" y="448" width="336" height="224" rx="12" fill="#0b0c0e"/></g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="24" fill="#d9dade">
    <rect x="504" y="487.5" width="336" height="1" fill="#ffffff" fill-opacity=".1"/>
    <circle cx="528" cy="468" r="6" fill="#ffffff" fill-opacity=".18"/><circle cx="548" cy="468" r="6" fill="#ffffff" fill-opacity=".18"/><circle cx="568" cy="468" r="6" fill="#ffffff" fill-opacity=".18"/>
    <path d="M599.304 459.678v17.9478M591.53 464.17l15.54 8.97M591.53 473.14l15.54 -8.97" stroke="#ffb24a" stroke-width="3.54783" stroke-linecap="round"/><text x="616" y="477">Claude Code</text>
    <text x="528" y="528" fill="#8a8d94">&gt; /deixis-watch</text>
    <text x="528" y="568"><tspan fill="#ffb24a">●</tspan> watch_rounds()</text>
    <text id="wait" class="a" x="528" y="608" xml:space="preserve" fill="#8a8d94">  waiting…</text>
    <g id="t2" class="a"><path d="M529.252 599.235l5.0087 5.42609 9.6 -12.5217" fill="none" stroke="#6fd48b" stroke-width="3.54783" stroke-linecap="round" stroke-linejoin="round"/><text x="560" y="608">Point 1 done</text></g>
    <g id="t3" class="a"><path d="M529.252 639.235l5.0087 5.42609 9.6 -12.5217" fill="none" stroke="#6fd48b" stroke-width="3.54783" stroke-linecap="round" stroke-linejoin="round"/><text x="560" y="648">Point 2 done</text></g>
  </g>

  
  <g transform="translate(748 236)">
    <circle id="rip1" class="a" cx="0" cy="-4" r="24" fill="none" stroke="#ffae33" stroke-width="2"/>
    <g id="pin1" class="a">
      <rect x="-2.5" y="-18" width="5" height="18" rx="2" fill="#ffaa2b"/>
      <circle cx="0" cy="-36" r="20" fill="#ffaa2b" stroke="#2a2a30" stroke-width="2.4" filter="url(#shs)"/>
      <text x="0" y="-27.6" text-anchor="middle" font-size="24" font-weight="800" fill="#3a2200">1</text>
      <g id="ok1" class="a">
        <circle cx="0" cy="-36" r="20" fill="#4cc36f" stroke="#2a2a30" stroke-width="2.4"/>
        <path d="M-8.4 -36l5.6 5.6 10.8-11.6" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
  
  <g transform="translate(436 324)">
    <circle id="rip2" class="a" cx="0" cy="-4" r="24" fill="none" stroke="#ffae33" stroke-width="2"/>
    <g id="pin2" class="a">
      <rect x="-2.5" y="-18" width="5" height="18" rx="2" fill="#ffaa2b"/>
      <circle cx="0" cy="-36" r="20" fill="#ffaa2b" stroke="#2a2a30" stroke-width="2.4" filter="url(#shs)"/>
      <text x="0" y="-27.6" text-anchor="middle" font-size="24" font-weight="800" fill="#3a2200">2</text>
      <g id="ok2" class="a">
        <circle cx="0" cy="-36" r="20" fill="#4cc36f" stroke="#2a2a30" stroke-width="2.4"/>
        <path d="M-8.4 -36l5.6 5.6 10.8-11.6" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- Pointer -->
  <g id="cur" class="a">
    <path d="M2 2v22l6-5.6 3.8 8.6 3.4-1.5-3.7-8.4H20z" transform="scale(1.25) translate(-2 -2)" fill="#111" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" filter="url(#shs)"/>
  </g>

  <!-- Screen edge light while listening -->
  <g class="a listen" fill="none">
    <rect x="0" y="0" width="880" height="712" rx="16" stroke="rgb(255,150,40)" stroke-opacity=".45" stroke-width="22" filter="url(#glow)"/>
    <rect x="1" y="1" width="878" height="710" rx="15" stroke="rgb(255,168,38)" stroke-opacity=".95" stroke-width="2"/>
  </g>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="288" viewBox="0 0 560 288" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif">
<title id="title">Step 1: point and talk</title>
<desc id="desc">A pin with the number 1 drops on the Book button of a Trip Planner page while you say: this button is too small.</desc>
<defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.36"/></filter>
  <filter id="shs" x="-60%" y="-60%" width="220%" height="240%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity=".3"/></filter>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#141a24"/><stop offset=".52" stop-color="#18171d"/><stop offset="1" stop-color="#221817"/>
  </linearGradient>
</defs>
<rect width="560" height="288" rx="16" fill="url(#wall)"/>

<g filter="url(#sh)"><rect x="32" y="32" width="496" height="136" rx="12" fill="#16181c"/></g>
<rect x="32.5" y="32.5" width="495" height="135" rx="11.5" fill="none" stroke="#2c3036"/>
<text x="56" y="88" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="-.5" fill="#e9ecef">Lisbon</text>
<text x="56" y="128" font-size="20" fill="#959ca6">4 nights · 2 guests</text>
<rect x="404" y="92" width="104" height="48" rx="12" fill="rgba(255,170,50,.18)" stroke="rgba(255,180,70,.85)" stroke-width="1.6"/>
<rect x="408" y="96" width="96" height="40" rx="9" fill="#3fbfa6"/>
<text x="456" y="123" text-anchor="middle" font-size="20" font-weight="650" fill="#16181c">Book</text>
<rect x="454.5" y="80" width="3" height="16" rx="1.2" fill="#ffaa2b"/>
<circle cx="456" cy="64" r="16" fill="#ffaa2b" stroke="#2a2a30" stroke-width="2.4" filter="url(#shs)"/>
<text x="456" y="71" text-anchor="middle" font-size="20" font-weight="800" fill="#3a2200">1</text>
<path d="M2 2v22l6-5.6 3.8 8.6 3.4-1.5-3.7-8.4H20z" transform="translate(488 126) scale(1.2) translate(-2 -2)" fill="#111" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" filter="url(#shs)"/>
<g filter="url(#sh)"><rect x="32" y="192" width="496" height="64" rx="16" fill="rgba(40,40,46,.9)"/></g><rect x="32.5" y="192.5" width="495" height="63" rx="15.5" fill="none" stroke="rgba(255,255,255,.1)"/>
<circle cx="64" cy="224" r="15" fill="#ffaa2b"/><text x="64" y="231" text-anchor="middle" font-size="20" font-weight="800" fill="#3a2200">1</text>
<text x="96" y="232" font-size="22" fill="#f2f2f4"><tspan font-weight="700" fill="#ffbe55">This</tspan> button is too small.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="880" height="384" viewBox="0 0 880 384" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif">
<title id="title">Step 1: point and talk</title>
<desc id="desc">A pin with the number 1 drops on the Book button of a Trip Planner page while you say: this button is too small.</desc>
<defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e1e28" flood-opacity="0.18"/></filter>
  <filter id="shs" x="-60%" y="-60%" width="220%" height="240%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity=".3"/></filter>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#dde5ee"/><stop offset=".52" stop-color="#ece8e2"/><stop offset="1" stop-color="#f2e2d6"/>
  </linearGradient>
</defs>
<rect width="880" height="384" rx="16" fill="url(#wall)"/>

<g filter="url(#sh)"><rect x="32" y="32" width="816" height="192" rx="16" fill="#f6f7f9"/></g>
<rect x="32.5" y="32.5" width="815" height="191" rx="15.5" fill="none" stroke="#e6e8ec"/>
<text x="64" y="120" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-.8" fill="#1b1f24">Lisbon</text>
<text x="64" y="176" font-size="30" fill="#68707b">4 nights · 2 guests</text>
<rect x="632" y="112" width="176" height="80" rx="18" fill="rgba(255,163,26,.16)" stroke="rgba(240,140,0,.85)" stroke-width="2"/>
<rect x="640" y="120" width="160" height="64" rx="12" fill="#0f6b5c"/>
<text x="720" y="163" text-anchor="middle" font-size="30" font-weight="650" fill="#f6f7f9">Book</text>
<rect x="717.5" y="92" width="5" height="32" rx="2" fill="#ffaa2b"/>
<circle cx="720" cy="72" r="24" fill="#ffaa2b" stroke="#ffffff" stroke-width="3" filter="url(#shs)"/>
<text x="720" y="82" text-anchor="middle" font-size="28" font-weight="800" fill="#3a2200">1</text>
<path d="M2 2v22l6-5.6 3.8 8.6 3.4-1.5-3.7-8.4H20z" transform="translate(768 160) scale(1.6) translate(-2 -2)" fill="#111" stroke="#fff" stroke-width="1.3" stroke-linejoin="round" filter="url(#shs)"/>
<g filter="url(#sh)"><rect x="32" y="256" width="816" height="96" rx="16" fill="rgba(250,250,252,.88)"/></g><rect x="32.5" y="256.5" width="815" height="95" rx="15.5" fill="none" stroke="rgba(255,255,255,.9)"/>
<circle cx="80" cy="304" r="22" fill="#ffaa2b"/><text x="80" y="314" text-anchor="middle" font-size="28" font-weight="800" fill="#3a2200">1</text>
<text x="128" y="315" font-size="32" fill="#1d1d1f"><tspan font-weight="700" fill="#8f4b00">This</tspan> button is too small.</text>
</svg>

name: Bug report
description: Something in the plugin does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please report security issues privately as described in SECURITY.md, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install the plugin
        2. Run /deixis-watch
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installing the plugin
        - MCP server or tools
        - /deixis-watch
        - Session hooks
        - Other
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: deixis-version
    attributes:
      label: Deixis version
      description: In Finder, select Deixis.app in Applications and choose File > Get Info.
  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "26.1"
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      description: Any error message from Claude Code or the launcher. Remove anything private first.
      render: text
